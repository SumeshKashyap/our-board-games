name: Release

# Push a tag like v1.2.0 to build a signed APK and publish it as a GitHub Release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.OURCHESS_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test and build signed release APK
        env:
          OURCHESS_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          OURCHESS_KEYSTORE_PASSWORD: ${{ secrets.OURCHESS_KEYSTORE_PASSWORD }}
          OURCHESS_KEY_ALIAS: ${{ secrets.OURCHESS_KEY_ALIAS }}
          OURCHESS_KEY_PASSWORD: ${{ secrets.OURCHESS_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew testDebugUnitTest assembleRelease -PappVersion="$VERSION"
          mv app/build/outputs/apk/release/app-release.apk "OurChess-$GITHUB_REF_NAME.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: OurChess-${{ github.ref_name }}.apk
          generate_release_notes: true
